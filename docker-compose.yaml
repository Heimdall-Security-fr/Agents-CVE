# ─────────────────────────────────────────────────────────────────────────────
#  Heimdall Agent Server — déploiement auto-hébergé
#
#  Démarre le serveur agent (dashboard + API d'ingestion) et sa base MongoDB.
#  Les agents installés sur vos postes envoient leur inventaire ici ; le serveur
#  corrèle ensuite avec le site CVE Heimdall.
#
#  Démarrage :   docker compose up -d          (image Docker Hub)
#                docker compose up -d --build  (build depuis les sources)
#  Dashboard :   http://localhost:4000/admin
#
#  ⚠️  AVANT LA PROD : changez AGENT_AUTH_TOKEN, DEFAULT_ADMIN_PASSWORD et
#      DASHBOARD_JWT_SECRET ci-dessous.
# ─────────────────────────────────────────────────────────────────────────────
services:
  agent_server:
    # Image publiée sur Docker Hub (tirée automatiquement). `--build` reconstruit
    # depuis les sources locales et l'étiquette avec ce même nom.
    image: heimdallsecurity/agent-cve:${AGENT_CVE_VERSION:-latest}
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: heimdall_agent_server
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      MONGO_URI: "mongodb://mongodb:27017/heimdall_agents"
      SERVER_PUBLIC_PORT: "4000"
      # IP/domaine public de CE serveur (utilisé dans les liens de téléchargement agent)
      SERVER_PUBLIC_HOST: "${SERVER_PUBLIC_HOST:-127.0.0.1}"
      # Token partagé serveur <-> agents — À CHANGER
      AGENT_AUTH_TOKEN: "${AGENT_AUTH_TOKEN:?Set AGENT_AUTH_TOKEN (32+ characters)}"
      # Clé de signature des sessions du dashboard — À CHANGER
      DASHBOARD_JWT_SECRET: "${DASHBOARD_JWT_SECRET:?Set DASHBOARD_JWT_SECRET (32+ characters)}"
      # Compte admin créé au premier démarrage — DÉFINISSEZ VOS PROPRES VALEURS
      DEFAULT_ADMIN_EMAIL: "${DEFAULT_ADMIN_EMAIL:?Set DEFAULT_ADMIN_EMAIL}"
      DEFAULT_ADMIN_PASSWORD: "${DEFAULT_ADMIN_PASSWORD:?Set DEFAULT_ADMIN_PASSWORD (12+ characters)}"
      DASHBOARD_ALLOWED_ORIGINS: "${DASHBOARD_ALLOWED_ORIGINS:-}"
      # URL publique du frontend CVE Heimdall
      HEIMDALL_FRONT_URL: "${HEIMDALL_FRONT_URL:-http://localhost:3000}"
      # API CVE Heimdall (site) interrogée pour les corrélations
      HEIMDALL_CVE_API: "${HEIMDALL_CVE_API:-http://cve_api:5000}"
      HEIMDALL_RSS_URL: "${HEIMDALL_RSS_URL:-http://cve_api:5000/cves/rss}"
      # Clé API CVE (optionnelle, plan premium)
      CVE_API_KEY: "${CVE_API_KEY:-}"
      # Logs centralisés (même API que le site CVE) — vide = désactivé
      LOGS_API_URL: "${LOGS_API_URL:-}"
      LOGS_API_KEY: "${LOGS_API_KEY:-}"
      LOGS_SERVER_NAME: "${LOGS_SERVER_NAME:-Agents-CVE}"
    depends_on:
      - mongodb

  mongodb:
    image: mongo:7
    container_name: heimdall_agent_mongo
    restart: unless-stopped
    volumes:
      - agent_mongo_data:/data/db
    # Décommentez pour exposer Mongo en local (debug) :
    # ports:
    #   - "27017:27017"

volumes:
  agent_mongo_data:
