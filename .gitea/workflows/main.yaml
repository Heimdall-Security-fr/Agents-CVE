# ─────────────────────────────────────────────────────────────────────────────
#  CI Agents CVE — build de l'image depuis la branche `agents`.
#
#  GitHub `main` est la source : sync-from-github.yaml aligne `agents` dessus et
#  publie lui-même l'image (toutes les 10 min). Ce workflow-ci sert à reconstruire
#  à la main (« Run workflow ») ou si un push sur `agents` le déclenche. Même
#  numérotation que la synchro : un même commit donne la même version, donc un
#  build en double ne provoque aucune mise à jour supplémentaire des agents.
#  Plus de miroir vers GitHub : GitHub n'est plus une copie, le force-push
#  y effacerait des commits.
#
#  Secrets Gitea requis (Repo → Settings → Actions → Secrets) :
#    DOCKERHUB_USERNAME   compte Docker Hub (namespace heimdallsecurity)
#    DOCKERHUB_TOKEN      Access Token Docker Hub (PAS le mot de passe du compte)
# ─────────────────────────────────────────────────────────────────────────────
name: agentscve

# Version : <AGENT_VERSION_BASE>.<nombre de commits> (ex. 1.1.46), toujours plus
# récente que la précédente : les agents installés se mettent à jour tout seuls.
# Changez AGENT_VERSION_BASE (ici, dans sync-from-github.yaml et le fichier VERSION)
# pour un changement mineur/majeur.
env:
  AGENT_VERSION_BASE: "1.1"

on:
  push:
    branches:
      - agents
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version
        id: version
        run: echo "version=${AGENT_VERSION_BASE}.$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          config-inline: |
            [registry."192.168.1.178:37777"]
              https = true
              insecure = true
      # docker/login-action exige le binaire `docker`, absent du runner (seul
      # buildx standalone y est). On écrit donc directement le fichier d'auth
      # que buildx lit au moment du push.
      - name: Login Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          mkdir -p ~/.docker
          AUTH=$(printf '%s:%s' "$DOCKERHUB_USERNAME" "$DOCKERHUB_TOKEN" | base64 -w0)
          printf '{"auths":{"https://index.docker.io/v1/":{"auth":"%s"}}}' "$AUTH" > ~/.docker/config.json
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./server/Dockerfile
          push: true
          pull: true
          build-args: |
            AGENT_VERSION=${{ steps.version.outputs.version }}
          tags: |
            192.168.1.178:37777/agentscve:latest
            heimdallsecurity/agent-cve:latest
            heimdallsecurity/agent-cve:${{ steps.version.outputs.version }}
            heimdallsecurity/agent-cve:${{ gitea.sha }}
