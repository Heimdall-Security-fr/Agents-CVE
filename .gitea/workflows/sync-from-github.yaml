# ─────────────────────────────────────────────────────────────────────────────
#  GitHub → Gitea → Docker Hub (100 % côté Gitea — aucun workflow sur GitHub).
#
#  GitHub (Heimdall-Security-fr/Agents-CVE, branche `main`) est la SOURCE : on y
#  pousse ou on y fusionne les PR. Toutes les 10 minutes, ce workflow :
#    1. avance la branche `agents` de Gitea jusqu'à GitHub `main` (fast-forward) ;
#    2. construit et publie l'image si celle de ce commit n'est pas encore sur
#       Docker Hub (rattrape aussi un build manqué ou échoué).
#  Le build est fait ICI : un push effectué avec le jeton automatique des Actions
#  ne déclenche aucun autre workflow, donc on ne compte pas sur main.yaml.
#
#  Version : <AGENT_VERSION_BASE>.<nombre de commits de main> (ex. 1.1.46). Elle
#  augmente à chaque commit ; reconstruire un même commit redonne la même version
#  (pas de mise à jour inutile des agents).
#
#  ⚠️ Gitea ne planifie les workflows `schedule` que depuis la branche PAR
#  DÉFAUT du dépôt : copiez ce fichier sur `site-cve` à chaque modification.
#  ⚠️ Pas de force-push : si `agents` a reçu des commits absents de GitHub, le job
#  échoue — rapportez-les sur GitHub (PR), puis réalignez `agents`.
#
#  Secrets Gitea requis : GH_MIRROR_TOKEN (lecture GitHub), DOCKERHUB_USERNAME,
#  DOCKERHUB_TOKEN (Access Token Docker Hub, pas le mot de passe).
# ─────────────────────────────────────────────────────────────────────────────
name: sync-from-github

concurrency:
  group: sync-from-github
  cancel-in-progress: false

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

env:
  AGENT_VERSION_BASE: "1.1"
  IMAGE: heimdallsecurity/agent-cve

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sync.outputs.sha }}
      version: ${{ steps.sync.outputs.version }}
      build: ${{ steps.sync.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agents
      - name: Aligner agents sur GitHub main
        id: sync
        env:
          GH_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
        run: |
          git remote add github "https://x-access-token:${GH_TOKEN}@github.com/Heimdall-Security-fr/Agents-CVE.git"
          git fetch github +refs/heads/main:refs/remotes/github/main
          SHA=$(git rev-parse github/main)
          if ! git merge-base --is-ancestor HEAD github/main; then
            echo "::error::agents contient des commits absents de GitHub main — fusion manuelle requise (pas de force-push)."
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$SHA" ]; then
            echo "$(git rev-list --count HEAD..github/main) nouveau(x) commit(s) sur GitHub main."
            git push origin github/main:agents
          fi
          VERSION="${AGENT_VERSION_BASE}.$(git rev-list --count github/main)"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://hub.docker.com/v2/repositories/${IMAGE}/tags/${SHA}" || true)
          if [ "$CODE" = "200" ]; then
            echo "Image ${SHA} déjà publiée : rien à construire."
            BUILD=false
          else
            echo "Image ${SHA} absente de Docker Hub (HTTP ${CODE}) : build de la version ${VERSION}."
            BUILD=true
          fi
          {
            echo "sha=${SHA}"
            echo "version=${VERSION}"
            echo "build=${BUILD}"
          } >> "$GITHUB_OUTPUT"

  publish:
    runs-on: ubuntu-latest
    needs: sync
    if: needs.sync.outputs.build == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.sha }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          config-inline: |
            [registry."192.168.1.178:37777"]
              https = true
              insecure = true
      # docker/login-action exige le binaire `docker`, absent du runner (seul
      # buildx standalone y est). On écrit donc directement le fichier d'auth
      # que buildx lit au moment du push.
      - name: Login Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          mkdir -p ~/.docker
          AUTH=$(printf '%s:%s' "$DOCKERHUB_USERNAME" "$DOCKERHUB_TOKEN" | base64 -w0)
          printf '{"auths":{"https://index.docker.io/v1/":{"auth":"%s"}}}' "$AUTH" > ~/.docker/config.json
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./server/Dockerfile
          push: true
          pull: true
          build-args: |
            AGENT_VERSION=${{ needs.sync.outputs.version }}
          tags: |
            192.168.1.178:37777/agentscve:latest
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ needs.sync.outputs.version }}
            ${{ env.IMAGE }}:${{ needs.sync.outputs.sha }}
